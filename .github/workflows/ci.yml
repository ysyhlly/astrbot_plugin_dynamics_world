name: CI

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout AstrBot
        uses: actions/checkout@v5
        with:
          repository: AstrBotDevs/AstrBot
          ref: v4.29.4
          path: AstrBot

      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: AstrBot/data/plugins/${{ github.event.repository.name }}

      - name: Check out the Chat Dynamics integration dependency
        uses: actions/checkout@v5
        with:
          repository: ysyhlly/astrbot_plugin_chat_dynamics
          path: AstrBot/data/plugins/astrbot_plugin_chat_dynamics
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            AstrBot/requirements.txt
            AstrBot/data/plugins/${{ github.event.repository.name }}/requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r AstrBot/requirements.txt
          plugin_dir="AstrBot/data/plugins/${{ github.event.repository.name }}"
          if [ -f "$plugin_dir/requirements.txt" ]; then
            python -m pip install -r "$plugin_dir/requirements.txt"
          fi
          if [ -f "$plugin_dir/requirements-dev.txt" ]; then
            python -m pip install -r "$plugin_dir/requirements-dev.txt"
          fi
          python -m pip install ruff pytest pytest-asyncio pyyaml

      - name: Ruff check
        working-directory: AstrBot/data/plugins/${{ github.event.repository.name }}
        run: python -m ruff check .

      - name: Run frontend JS unit tests
        working-directory: AstrBot/data/plugins/${{ github.event.repository.name }}
        run: node --test tests/test_avatar_state.mjs

      - name: Verify release package hygiene and structure
        working-directory: AstrBot/data/plugins/${{ github.event.repository.name }}
        run: |
          python build_release.py "$RUNNER_TEMP/install.zip"
          python - "$RUNNER_TEMP/install.zip" <<'PY'
          import sys, zipfile
          zpath = sys.argv[1]
          prefix = "astrbot_plugin_dynamics_world/"
          banned_parts = {".git", ".github", "tests", "src", "node_modules", "__pycache__"}
          banned_files = {
              "build_release.py", "package.json", "package-lock.json",
              ".gitignore", ".gitattributes", "requirements-dev.txt",
          }
          with zipfile.ZipFile(zpath) as zf:
              names = zf.namelist()
          assert names, "Empty release archive"
          for name in names:
              assert name.startswith(prefix), f"Missing top-level plugin dir: {name}"
              rel = name[len(prefix):]
              parts = rel.split("/")
              assert not (set(parts) & banned_parts), f"Banned dir leaked: {name}"
              assert parts[-1] not in banned_files, f"Banned dev file leaked: {name}"
              assert not rel.endswith((".sqlite3", ".db", ".pyc", ".bak")), f"Runtime artifact leaked: {name}"
          for required in (
              prefix + "main.py",
              prefix + "metadata.yaml",
              prefix + "_conf_schema.json",
              prefix + "pages/world/cabin3d.min.js",
              prefix + "vendor/azgaar/index.html",
          ):
              assert required in names, f"Missing required runtime asset: {required}"
          print(f"Verified {len(names)} packaged files under {prefix}")
          PY

      - name: Run unit tests
        working-directory: AstrBot/data/plugins/${{ github.event.repository.name }}
        env:
          ASTRBOT_ROOT: ${{ runner.temp }}/astrbot-ci
          PYTHONPATH: ${{ github.workspace }}/AstrBot/data/plugins:${{ github.workspace }}/AstrBot
        run: |
          mkdir -p "$ASTRBOT_ROOT"
          python -m pytest tests -q --ignore-glob="*browser*"
