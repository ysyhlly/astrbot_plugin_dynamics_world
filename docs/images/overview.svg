    <text x="42" y="179" class="c-body">· 酒馆 JSON 与文本导入</text>
    <text x="42" y="200" class="c-body">· 关键词/常驻/场景条目</text>
    <text x="42" y="221" class="c-body">· 按会话绑定与注入预览</text>
    <text x="42" y="242" class="c-body">· 可选同步至宿主人格</text>
  </g>
  <line x1="264" y1="198" x2="285" y2="198" stroke="#6366F1" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#cardShadow)">
    <rect x="290" y="100" width="236" height="196" rx="12" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.4"/>
    <path d="M 302 100 L 514 100 Q 526 100 526 112 L 526 140 L 290 140 L 290 112 Q 290 100 302 100 Z" fill="#F0F9FF"/>
    <line x1="290" y1="140" x2="526" y2="140" stroke="#7DD3FC" stroke-width="1"/>
    <rect x="302" y="109" width="26" height="22" rx="6" fill="#0369A1"/>
    <text x="315" y="124" text-anchor="middle" class="c-num">02</text>
    <text x="336" y="125" class="c-title" fill="#0369A1">双地图与天气</text>
    <text x="304" y="158" class="c-sub">Azgaar / OSM + Weather</text>
    <text x="304" y="179" class="c-body">· 离线虚拟地形与现实地图</text>
    <text x="304" y="200" class="c-body">· 陆地网格寻路与 ETA 行程</text>
    <text x="304" y="221" class="c-body">· 模拟气候 / MET / 和风主备</text>
    <text x="304" y="242" class="c-body">· 天气骤变触发有界评估</text>
  </g>
  <line x1="526" y1="198" x2="547" y2="198" stroke="#6366F1" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#cardShadow)">
    <rect x="552" y="100" width="236" height="196" rx="12" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.4"/>
    <path d="M 564 100 L 776 100 Q 788 100 788 112 L 788 140 L 552 140 L 552 112 Q 552 100 564 100 Z" fill="#FFFBEB"/>
    <line x1="552" y1="140" x2="788" y2="140" stroke="#FCD34D" stroke-width="1"/>
    <rect x="564" y="109" width="26" height="22" rx="6" fill="#B45309"/>
    <text x="577" y="124" text-anchor="middle" class="c-num">03</text>
    <text x="598" y="125" class="c-title" fill="#B45309">自主生活与创作</text>
    <text x="566" y="158" class="c-sub">Causal Life &amp; Projects</text>
    <text x="566" y="179" class="c-body">· 后台按作息与兴趣推演</text>
    <text x="566" y="200" class="c-body">· 房间物品与笔记本/电脑交互</text>
    <text x="566" y="221" class="c-body">· 文字创作构思→初稿→定稿</text>
    <text x="566" y="242" class="c-body">· 日记、约定与联系动机沉淀</text>
  </g>
  <line x1="788" y1="198" x2="809" y2="198" stroke="#6366F1" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#cardShadow)">
    <rect x="814" y="100" width="236" height="196" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.4"/>
    <path d="M 826 100 L 1038 100 Q 1050 100 1050 112 L 1050 140 L 814 140 L 814 112 Q 814 100 826 100 Z" fill="#ECFDF5"/>
    <line x1="814" y1="140" x2="1050" y2="140" stroke="#6EE7B7" stroke-width="1"/>
    <rect x="826" y="109" width="26" height="22" rx="6" fill="#047857"/>
    <text x="839" y="124" text-anchor="middle" class="c-num">04</text>
    <text x="860" y="125" class="c-title" fill="#047857">3D 小屋与联动</text>
    <text x="828" y="158" class="c-sub">3D Cabin · World v1</text>
    <text x="828" y="179" class="c-body">· 真 3D 实况与 SSE 增量流</text>
    <text x="828" y="200" class="c-body">· 共享世界组、信箱与 24h 回放</text>
    <text x="828" y="221" class="c-body">· 只向群间提供快照不越权发送</text>
    <text x="828" y="242" class="c-body">· 通过 visual_sharing 联动生图</text>
  </g>
  <rect x="28" y="316" width="1024" height="82" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>  <text x="44" y="341" class="c-sec" fill="#1E293B">数据边界与系列协作（不复写群间记忆，不替代群间发言权）</text>
  <rect x="44" y="356" width="239" height="26" rx="13" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1"/>
  <text x="163.5" y="373" text-anchor="middle" class="c-chip" fill="#4338CA">World Integration v1 协议</text>
  <rect x="295" y="356" width="239" height="26" rx="13" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="414.5" y="373" text-anchor="middle" class="c-chip" fill="#047857">SQLite 代次隔离与回滚</text>
  <rect x="546" y="356" width="239" height="26" rx="13" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
  <text x="665.5" y="373" text-anchor="middle" class="c-chip" fill="#B45309">兼容旧世界书/动态生活迁移</text>
  <rect x="797" y="356" width="239" height="26" rx="13" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="916.5" y="373" text-anchor="middle" class="c-chip" fill="#6D28D9">群间视觉受限参考图授权</text>
